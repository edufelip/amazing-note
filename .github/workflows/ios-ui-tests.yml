name: iOS UI Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1-5"

concurrency:
  group: ios-ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: XCUITests
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write GoogleService-Info.plist (placeholder)
        run: |
          cat <<'EOF' > iosApp/iosApp/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>API_KEY</key>
            <string>CI_PLACEHOLDER</string>
            <key>PROJECT_ID</key>
            <string>amazing-note-ci</string>
            <key>BUNDLE_ID</key>
            <string>com.edufelip.amazingnote</string>
            <key>STORAGE_BUCKET</key>
            <string>amazing-note-ci.appspot.com</string>
          </dict>
          </plist>
          EOF

      - name: Generate Compose resources (iOS simulator)
        run: ./gradlew :composeApp:iosSimulatorArm64AggregateResources --stacktrace

      - name: Generate Xcode project
        run: xcodegen
        working-directory: iosApp

      - name: Run UI tests
        run: |
          xcodebuild test \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=18.6" \
            -only-testing:iosAppUITests
