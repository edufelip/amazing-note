name: iOS PR

on:
  pull_request:
    branches:
      - "main"
      - "develop"
      - "hotfix/*"
    paths:
      - "iosApp/**"
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "build-logic/**"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"

concurrency:
  group: ios-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Snapshot Tests
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write GoogleService-Info.plist (placeholder)
        run: |
          cat <<'EOF' > iosApp/iosApp/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>API_KEY</key>
            <string>CI_PLACEHOLDER</string>
            <key>PROJECT_ID</key>
            <string>amazing-note-ci</string>
            <key>BUNDLE_ID</key>
            <string>com.edufelip.amazingnote</string>
            <key>STORAGE_BUCKET</key>
            <string>amazing-note-ci.appspot.com</string>
          </dict>
          </plist>
          EOF

      - name: Generate Compose resources (iOS simulator)
        run: ./gradlew :composeApp:iosSimulatorArm64AggregateResources --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen
        working-directory: iosApp

      - name: Run Snapshot tests
        run: |
          xcodebuild test \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -derivedDataPath iosApp/build/DerivedData \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.6" \
            -only-testing:iosAppTests

      - name: Resolve SwiftPM frameworks dir
        id: firebase-frameworks
        run: echo "dir=$(./scripts/resolve_spm_frameworks_dir.sh)" >> "$GITHUB_OUTPUT"

      - name: Run shared tests
        env:
          FIREBASE_IOS_FRAMEWORKS_DIR: ${{ steps.firebase-frameworks.outputs.dir }}
        run: ./gradlew :shared:allTests --stacktrace
