name: iOS PR

on:
  pull_request:
    branches:
      - "main"
      - "develop"
      - "hotfix/*"
    paths:
      - "iosApp/**"
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "build-logic/**"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"

concurrency:
  group: ios-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Snapshot Tests
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write GoogleService-Info.plist
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          mkdir -p iosApp/iosApp
          echo "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist

      - name: Generate Compose resources (iOS simulator)
        run: ./gradlew :composeApp:iosSimulatorArm64AggregateResources --stacktrace

      - name: Sync ComposeApp framework (iOS simulator)
        run: ./gradlew :iosApp:packForXcode -PSDK_NAME=iphonesimulator -PCONFIGURATION=Debug --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen
        working-directory: iosApp

      - name: Run Snapshot tests
        run: |
          xcodebuild test \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -derivedDataPath iosApp/build/DerivedData \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.6" \
            -only-testing:iosAppTests

      - name: Resolve SwiftPM frameworks dir
        id: firebase-frameworks
        env:
          DERIVED_DATA: iosApp/build/DerivedData
          CONFIG: Debug
          PLATFORM_NAME: iphonesimulator
          SCHEME: iosApp
        run: echo "dir=$(./scripts/resolve_spm_frameworks_dir.sh)" >> "$GITHUB_OUTPUT"

      - name: Run shared tests
        env:
          FIREBASE_IOS_FRAMEWORKS_DIR: ${{ steps.firebase-frameworks.outputs.dir }}
        run: ./gradlew :shared:allTests -Pfirebase.ios.frameworks.dir="${{ steps.firebase-frameworks.outputs.dir }}" --stacktrace
