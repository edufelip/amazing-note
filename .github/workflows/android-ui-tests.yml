name: Android UI Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1-5"

concurrency:
  group: android-ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: Instrumented UI Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write google-services.json (placeholder)
        run: |
          mkdir -p app
          cat <<'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "amazing-note-ci",
              "storage_bucket": "amazing-note-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.edufelip.amazing_note"
                  }
                },
                "api_key": [
                  {
                    "current_key": "CI_PLACEHOLDER"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
