name: iosApp
options:
  minimumXcodeGenVersion: 2.37.0
  objectVersion: 60
configs:
  Debug: debug
  Release: release
settings:
  IPHONEOS_DEPLOYMENT_TARGET: 17.2
  SWIFT_VERSION: 5.9
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.4.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.15.0
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    entitlements: iosApp/iosApp.entitlements
    sources:
      - path: iosApp
        excludes:
          - "**/*.plist"
      - path: note_cipher_ios.c
        type: file
      - path: iosApp/GoogleService-Info.plist
        type: file
        buildPhase: resources
    settings:
      INFOPLIST_FILE: iosApp/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.edufelip.amazingnote
      CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
      FRAMEWORK_SEARCH_PATHS:
        - "$(inherited)"
        - "$(CONFIGURATION_BUILD_DIR)"
      FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
        - "$(inherited)"
        - "$(CONFIGURATION_BUILD_DIR)"
        - "$(SRCROOT)/Frameworks/$(CONFIGURATION)-iphonesimulator"
      FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
        - "$(inherited)"
        - "$(CONFIGURATION_BUILD_DIR)"
        - "$(SRCROOT)/Frameworks/$(CONFIGURATION)-iphoneos"
      EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-framework"
        - "ComposeApp"
    resources: []
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
      - sdk: libsqlite3.tbd
    prebuildScripts:
      - name: Generate Compose Resources
        shellPath: /bin/sh
        script: |
          set -euo pipefail
          ROOT_DIR="${SRCROOT}/.."
          GRADLEW="${ROOT_DIR}/gradlew"
          GRADLE_USER_HOME="${ROOT_DIR}/.gradle-xcode"
          KONAN_DATA_DIR="${ROOT_DIR}/.konan"
          KOTLIN_VERSION=$(awk -F'=' '/^kotlin[[:space:]]*=/{gsub(/"/,"",$2); gsub(/[[:space:]]/,"",$2); print $2; exit}' "${ROOT_DIR}/gradle/libs.versions.toml" || true)
          KONAN_ARCH="x64"
          if [[ "$(uname -m)" == "arm64" ]]; then
            KONAN_ARCH="aarch64"
          fi
          KONAN_HOME=""
          if [[ -n "${KOTLIN_VERSION}" ]]; then
            KONAN_HOME="${KONAN_DATA_DIR}/kotlin-native-prebuilt-macos-${KONAN_ARCH}-${KOTLIN_VERSION}"
          fi
          KONAN_HOME_ARG=""
          if [[ -n "${KONAN_HOME}" ]]; then
            KONAN_HOME_ARG="-Pkotlin.native.home=${KONAN_HOME}"
          fi
          mkdir -p "${GRADLE_USER_HOME}" "${KONAN_DATA_DIR}"
          SDK_NAME_VALUE="${SDK_NAME:-iphonesimulator}"
          STAMP_FILE=".stamp"
          SOURCE_DIR="${ROOT_DIR}/composeApp/src/commonMain/composeResources"
          GENERATED_BASE="${ROOT_DIR}/composeApp/build/generated/compose/resourceGenerator/assembledResources"

          if [[ "${SDK_NAME_VALUE}" == iphoneos* ]]; then
            ARCH_DIR="iosArm64Main"
          else
            if [[ "${ARCHS:-}" == *"x86_64"* && "${ARCHS:-}" != *"arm64"* ]]; then
              ARCH_DIR="iosX64Main"
            else
              ARCH_DIR="iosSimulatorArm64Main"
            fi
          fi

          TARGET_RESOURCES="${GENERATED_BASE}/${ARCH_DIR}/composeResources"
          NEED_RUN=0

          if [[ ! -d "${TARGET_RESOURCES}" ]]; then
            NEED_RUN=1
          elif [[ -d "${SOURCE_DIR}" ]]; then
            LATEST_SOURCE=$(find "${SOURCE_DIR}" -type f -print0 | xargs -0 stat -f %m | sort -n | tail -1 || true)
            if [[ -f "${TARGET_RESOURCES}/${STAMP_FILE}" ]]; then
              LATEST_GENERATED=$(stat -f %m "${TARGET_RESOURCES}/${STAMP_FILE}")
            else
              LATEST_GENERATED=$(find "${TARGET_RESOURCES}" -type f -print0 | xargs -0 stat -f %m | sort -n | tail -1)
            fi
            if [[ -n "${LATEST_SOURCE}" && -n "${LATEST_GENERATED}" && "${LATEST_GENERATED}" -lt "${LATEST_SOURCE}" ]]; then
              NEED_RUN=1
            fi
          fi

          if [[ "${NEED_RUN}" -eq 1 ]]; then
            if [[ ! -x "${GRADLEW}" ]]; then
              echo "error: Gradle wrapper not found at ${GRADLEW}."
              exit 1
            fi
            KONAN_DATA_DIR="${KONAN_DATA_DIR}" GRADLE_USER_HOME="${GRADLE_USER_HOME}" "${GRADLEW}" ${KONAN_HOME_ARG} -PSDK_NAME="${SDK_NAME_VALUE}" :composeApp:packForXcode
            if [[ ! -d "${TARGET_RESOURCES}" ]]; then
              echo "error: Compose resources not found. Run ./gradlew -PSDK_NAME=${SDK_NAME_VALUE} :composeApp:packForXcode"
              exit 1
            fi
            date +%s > "${TARGET_RESOURCES}/${STAMP_FILE}"
          fi
    postbuildScripts:
      - name: Crashlytics dSYM Upload
        shellPath: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          if [[ "${CONFIGURATION}" == "Debug" ]]; then
            echo "Crashlytics dSYM upload skipped for Debug configuration."
            exit 0
          fi

          GOOGLE_SERVICE_INFO_PLIST="${SRCROOT}/iosApp/GoogleService-Info.plist"

          if [[ ! -f "${GOOGLE_SERVICE_INFO_PLIST}" ]]; then
            echo "warning: GoogleService-Info.plist not found at ${GOOGLE_SERVICE_INFO_PLIST}. Skipping Crashlytics upload."
            exit 0
          fi

          if [[ -z "${DWARF_DSYM_FOLDER_PATH:-}" || -z "${DWARF_DSYM_FILE_NAME:-}" ]]; then
            echo "warning: dSYM information not available. Skipping Crashlytics upload."
            exit 0
          fi

          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run" \
            -gsp "${GOOGLE_SERVICE_INFO_PLIST}" \
            -d "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
        inputFiles:
          - "$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)"
          - "$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(PRODUCT_NAME)"
          - "$(SRCROOT)/iosApp/GoogleService-Info.plist"
      - name: Copy Compose Resources
        shellPath: /bin/sh
        script: |
          set -euo pipefail

          if [[ "${SDK_NAME:-}" == iphoneos* ]]; then
            ARCH_DIR="iosArm64Main"
          else
            if [[ "${ARCHS:-}" == *"x86_64"* && "${ARCHS:-}" != *"arm64"* ]]; then
              ARCH_DIR="iosX64Main"
            else
              ARCH_DIR="iosSimulatorArm64Main"
            fi
          fi

          SRC_RESOURCES="${SRCROOT}/../composeApp/build/generated/compose/resourceGenerator/assembledResources/${ARCH_DIR}/composeResources"

          if [[ ! -d "${SRC_RESOURCES}" ]]; then
            echo "error: Compose resources not found. Run ./gradlew -PSDK_NAME=${SDK_NAME:-iphonesimulator} :composeApp:packForXcode"
            exit 1
          fi

          STAMP_FILE=".stamp"
          SOURCE_DIR="${SRCROOT}/../composeApp/src/commonMain/composeResources"
          if [[ -d "${SOURCE_DIR}" ]]; then
            LATEST_SOURCE=$(find "${SOURCE_DIR}" -type f -print0 | xargs -0 stat -f %m | sort -n | tail -1)
            if [[ -f "${SRC_RESOURCES}/${STAMP_FILE}" ]]; then
              LATEST_GENERATED=$(stat -f %m "${SRC_RESOURCES}/${STAMP_FILE}")
            else
              LATEST_GENERATED=$(find "${SRC_RESOURCES}" -type f -print0 | xargs -0 stat -f %m | sort -n | tail -1)
            fi
            if [[ -n "${LATEST_SOURCE}" && -n "${LATEST_GENERATED}" && "${LATEST_GENERATED}" -lt "${LATEST_SOURCE}" ]]; then
              echo "error: Compose resources are stale. Run ./gradlew -PSDK_NAME=${SDK_NAME:-iphonesimulator} :composeApp:packForXcode"
              exit 1
            fi
          fi

          DEST_RESOURCES="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}/compose-resources/composeResources"
          mkdir -p "${DEST_RESOURCES}"
          rsync -a "${SRC_RESOURCES}/" "${DEST_RESOURCES}/"
    scheme:
      testTargets:
        - iosAppTests
        - iosAppUITests
      gatherCoverageData: false
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iosAppTests
    dependencies:
      - target: iosApp
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      GENERATE_INFOPLIST_FILE: YES
      FRAMEWORK_SEARCH_PATHS:
        - "$(inherited)"
        - "$(CONFIGURATION_BUILD_DIR)"
        - "$(SRCROOT)/Frameworks/$(CONFIGURATION)-iphonesimulator"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-framework"
        - "ComposeApp"
    postbuildScripts:
      - name: Copy Compose Resources
        shellPath: /bin/sh
        script: |
          set -euo pipefail
          if [[ -n "${TEST_HOST:-}" ]]; then
            HOST_APP_DIR="${TEST_HOST%/*}"
          else
            HOST_APP_DIR="${BUILT_PRODUCTS_DIR}/iosApp.app"
          fi

          SRC_RESOURCES="${HOST_APP_DIR}/compose-resources/composeResources"

          if [[ ! -d "${SRC_RESOURCES}" ]]; then
            if [[ "${SDK_NAME:-}" == iphoneos* ]]; then
              ARCH_DIR="iosArm64Main"
            else
              if [[ "${ARCHS:-}" == *"x86_64"* && "${ARCHS:-}" != *"arm64"* ]]; then
                ARCH_DIR="iosX64Main"
              else
                ARCH_DIR="iosSimulatorArm64Main"
              fi
            fi

            SRC_RESOURCES="${SRCROOT}/../composeApp/build/generated/compose/resourceGenerator/assembledResources/${ARCH_DIR}/composeResources"
          fi
          if [[ ! -d "${SRC_RESOURCES}" ]]; then
            echo "error: Compose resources not found. Run ./gradlew -PSDK_NAME=${SDK_NAME:-iphonesimulator} :composeApp:packForXcode"
            exit 1
          fi

          STAMP_FILE=".stamp"
          SOURCE_DIR="${SRCROOT}/../composeApp/src/commonMain/composeResources"
          if [[ -d "${SOURCE_DIR}" ]]; then
            LATEST_SOURCE=$(find "${SOURCE_DIR}" -type f -print0 | xargs -0 stat -f %m | sort -n | tail -1)
            if [[ -f "${SRC_RESOURCES}/${STAMP_FILE}" ]]; then
              LATEST_GENERATED=$(stat -f %m "${SRC_RESOURCES}/${STAMP_FILE}")
            else
              LATEST_GENERATED=$(find "${SRC_RESOURCES}" -type f -print0 | xargs -0 stat -f %m | sort -n | tail -1)
            fi
            if [[ -n "${LATEST_SOURCE}" && -n "${LATEST_GENERATED}" && "${LATEST_GENERATED}" -lt "${LATEST_SOURCE}" ]]; then
              echo "error: Compose resources are stale. Run ./gradlew -PSDK_NAME=${SDK_NAME:-iphonesimulator} :composeApp:packForXcode"
              exit 1
            fi
          fi

          DEST_RESOURCES="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}/compose-resources/composeResources"
          mkdir -p "${DEST_RESOURCES}"
          rsync -a "${SRC_RESOURCES}/" "${DEST_RESOURCES}/"
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      GENERATE_INFOPLIST_FILE: YES
